name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: solar-profitability-estimator

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: Build Docker image
        run: docker build -t solar-cell-api ./src/SolarProfitabilityEstimator.Api

      - name: Run container and smoke test
        run: |
          docker run -d --name solar-cell-api -p 8080:8080 solar-cell-api
          sleep 5
          curl --fail http://localhost:8080/swagger
          docker stop solar-cell-api

      - name: Stop Docker container
        if: always()
        run: docker stop solar-cell-api